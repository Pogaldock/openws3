# WS3 Unlocked: builds and tests the firmware on every push to the rot-theme branch, then publishes the installer.
#   test     every check, with a read-only token: unit tests, the whole-firmware simulation, the 8051 tests, the build itself
#   publish  only after "test" passed: SHA256SUMS, a signed build-provenance attestation, and a release: rot-latest (moves to the
#            newest build of the branch), or, for a version tag v*, a release of that version with RELEASE_NOTES.md (kept, never changed)
# Third-party actions are pinned to commit SHAs (the tag in the comment); the SDCC download is checked by its SHA-256.
name: WS3 Unlocked build
on:
  push:
    branches: [rot-theme]
    tags: ['v*']
  pull_request:                                       # a proposed change is tested before it can be merged (it never publishes: see publish)
    branches: [rot-theme]
  workflow_dispatch:                                  # by hand (Actions tab): with a version, publishes that version's release
    inputs:
      version: { description: 'Version to release, e.g. v0.2.0-beta.1 (empty: just rebuild rot-latest)', required: false, default: '' }
permissions: { contents: read }
# a newer push cancels an older push build; a release by hand (with a version) has its own group, so a push never cancels it
concurrency: { group: "rot-build-${{ github.ref }}-${{ inputs.version || github.event_name }}", cancel-in-progress: true }
jobs:
  test:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with: { fetch-depth: 0, persist-credentials: false }            # the build id comes from git
      - name: SDCC 4.6.0     # the release the firmware is built and tested with
        run: |
          curl -fsSL -o sdcc.tar.bz2 https://sourceforge.net/projects/sdcc/files/sdcc-linux-amd64/4.6.0/sdcc-4.6.0-amd64-unknown-linux2.5.tar.bz2/download
          echo "f6b929c62ed3082a26087885e0f1f9bf41878602ef1f57e40b11b4a01bf4f366  sdcc.tar.bz2" | sha256sum -c -
          tar xjf sdcc.tar.bz2 -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/sdcc-4.6.0/bin" >> "$GITHUB_PATH"
      - name: Unit tests (charge logic, limits, menu, settings) and the requirements check
        run: make test
      - name: Static analysis (cppcheck; findings kept by hand are in tools/cppcheck.supp with their reasons)
        run: |
          sudo apt-get install -y -qq cppcheck >/dev/null
          tools/cppcheck.sh
      - name: Whole-firmware safety scenarios on a simulated board
        run: make sim
      - name: Fuzzer, a short batch (random events, the safety rules checked every pass; the long run is the Fuzz workflow)
        run: make fuzz FUZZ_SEED=1 FUZZ_SEEDS=24 FUZZ_HOURS=6
      - name: Firmware and installer
        run: make
      - name: Flash use and checksums
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          data = open('build/fw.bin', 'rb').read()
          used = len(data.rstrip(b'\xff'))
          print(f"Flash used: {used} of 65536 bytes ({used * 100 // 65536} %), {65536 - used} free")
          PY
          cd build && sha256sum fw.bin openws3.html > SHA256SUMS && cat SHA256SUMS | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with: { name: firmware, path: "build/fw.bin\nbuild/openws3.html\nbuild/SHA256SUMS", if-no-files-found: error }
      # last, after the published files are built and uploaded: the 8051 simulator comes from the distribution's packages, so
      # nothing it installs can touch them; publish still needs this step to pass
      - name: Pure, menu and port-settings unit tests and the charge-logic trace on a simulated 8051 (16-bit int, as on the charger)
        run: |
          sudo apt-get install -y -qq sdcc-ucsim >/dev/null      # s51, the 8051 simulator; this job holds no write token
          make check-8051

  coverage:      # beside "test": which lines the unit tests and the simulation never run; the safety files must stay at 98 % or more
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Line coverage
        run: |
          pip install --break-system-packages -q gcovr==8.4
          tools/coverage.sh
          { echo '```'; cat build/cov/coverage.txt build/cov/branches.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [test, coverage]
    # only the main branch or a version tag publishes: a run on another branch (by hand) tests and builds, nothing more
    if: github.ref == 'refs/heads/rot-theme' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions: { contents: write, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2  (RELEASE_NOTES.md, and the branch check)
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with: { name: firmware, path: out }
      - name: Checksums still match
        run: cd out && sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be   # v2.4.0
        with: { subject-path: "out/fw.bin\nout/openws3.html" }
      - name: Publish the installer
        env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}', INPUT_VERSION: '${{ inputs.version }}' }
        run: |
          short=$(echo "$GITHUB_SHA" | cut -c1-8)
          notes="Built from commit $short by GitHub Actions, after every test passed. SHA-256 of the files is in SHA256SUMS; check the
          build provenance with: gh attestation verify fw.bin -R $GITHUB_REPOSITORY. Download openws3.html, open it in Chrome or Edge,
          press Connect, follow the install steps. Unofficial firmware that replaces VIFLY's: read SAFETY.md, supervise charging."
          ver="$INPUT_VERSION"; [ "$GITHUB_REF_TYPE" = tag ] && ver="$GITHUB_REF_NAME"
          if [ -n "$ver" ]; then                         # a version: its own release, kept; a "-beta" or "-rc" version is a pre-release
            num() { sed -n "s/^#define $1 *\([0-9]*\).*/\1/p" src/version.h; }
            want="v$(num FW_MAJOR).$(num FW_MINOR).0"; [ "$(num FW_PRE)" != 0 ] && want="$want-beta.$(num FW_PRE)"
            old=$(git rev-parse -q --verify "refs/tags/$ver^{commit}" || true)
            if [ -n "$old" ] && [ "$old" != "$GITHUB_SHA" ]; then echo "error: tag $ver exists at another commit ($old)"; exit 1; fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/rot-theme; then echo "error: $GITHUB_SHA is not on the main branch (rot-theme)"; exit 1; fi
            if [ "$ver" != "$want" ]; then echo "error: version $ver, but src/version.h says $want (what the charger reports)"; exit 1; fi
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$ver" >/dev/null 2>&1; then echo "error: release $ver exists already; it is never replaced"; exit 1; fi
            pre=""; case "$ver" in *-*) pre=--prerelease ;; esac
            gh release create "$ver" out/fw.bin out/openws3.html out/SHA256SUMS LICENSE --target "$GITHUB_SHA" $pre \
              --title "WS3 Unlocked $ver" --notes-file RELEASE_NOTES.md
            exit 0
          fi
          # rot-latest is updated in place (never deleted first), so its link always works
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/rot-latest" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/rot-latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release upload rot-latest out/fw.bin out/openws3.html out/SHA256SUMS LICENSE --clobber
            gh release edit rot-latest --title "WS3 Unlocked, latest build ($short)" --notes "$notes" --prerelease
          else
            gh release create rot-latest out/fw.bin out/openws3.html out/SHA256SUMS LICENSE --target "$GITHUB_SHA" --prerelease \
              --title "WS3 Unlocked, latest build ($short)" --notes "$notes"
          fi
