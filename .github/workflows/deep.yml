# WS3 Unlocked: the tests too slow for every build, weekly and on demand (Actions tab, "Deep tests", Run workflow).
#   - the charge-logic and input-limits unit suites on the simulated 8051 (16-bit int, as on the charger): every build runs the
#     other suites there, these two take tens of minutes to hours in the simulator
#   - a long fuzz run: thousands of random seeds over simulated hours (every build runs 24)
name: Deep tests
on:
  schedule: [{ cron: '17 3 * * 1' }]                 # Mondays, early morning UTC
  workflow_dispatch:
    inputs:
      seeds: { description: 'Fuzz seeds', required: false, default: '3000' }
permissions: { contents: read }
jobs:
  s51:
    strategy: { fail-fast: false, matrix: { suite: [chg, limits] } }
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with: { fetch-depth: 0, persist-credentials: false }
      - name: SDCC 4.6.0 and s51
        run: |
          curl -fsSL -o sdcc.tar.bz2 https://sourceforge.net/projects/sdcc/files/sdcc-linux-amd64/4.6.0/sdcc-4.6.0-amd64-unknown-linux2.5.tar.bz2/download
          echo "f6b929c62ed3082a26087885e0f1f9bf41878602ef1f57e40b11b4a01bf4f366  sdcc.tar.bz2" | sha256sum -c -
          tar xjf sdcc.tar.bz2 -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/sdcc-4.6.0/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y -qq sdcc-ucsim >/dev/null
      - name: The ${{ matrix.suite }} suite on the simulated 8051
        run: test/s51_suite.sh ${{ matrix.suite }} 19800 | tee out.txt; { echo '```'; tail -n 20 out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Fuzz
        env: { SEEDS: '${{ inputs.seeds || 3000 }}' }
        run: |
          case "$SEEDS" in *[!0-9]*|'') echo "numbers only"; exit 1 ;; esac
          make build/sim_fuzz
          set -o pipefail
          FIRST=$(( $(date +%s) / 86400 % 100000 * 10000 ))       # new seeds every run, printed so a failure can be repeated
          echo "first seed $FIRST"
          ./build/sim_fuzz -s "$FIRST" -n "$SEEDS" -j "$(nproc)" -H 8 2>&1 | tee fuzz.txt
          rc=$?
          { echo "first seed $FIRST"; echo '```'; tail -n 60 fuzz.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
